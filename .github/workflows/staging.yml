name: Deploy to Staging
on:
  push:
    branches: [develop]
  workflow_dispatch:
concurrency:
  group: deploy-staging
  cancel-in-progress: true
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Guard - source lengkap
        run: |
          set -e
          grep -q "service_quotations" src/worker.js || { echo "::error::worker.js tanpa Services Quota"; exit 1; }
          grep -q "Services Quota" src/index.html    || { echo "::error::index.html tanpa Services Quota"; exit 1; }
          node --check src/worker.js
      - name: Cek staging sudah disiapkan
        run: grep -q "REPLACE_WITH_STAGING_D1_ID" wrangler.staging.toml && { echo "::error::Jalankan scripts/staging-setup.ps1 dulu"; exit 1; } || true
      - run: npx wrangler deploy --config wrangler.staging.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 190caf983ef384fa72f7285d6aee157a
